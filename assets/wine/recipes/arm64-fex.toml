# Upstream Wine 11.20 / FEX-2610 with the minimal Darwin compatibility overlay.
# Core runtime with built-in WineD3D; graphics add-ons use separate recipes.
# Build/probe results do not certify games. Upstream licenses remain applicable.
schema = 1

[sources.shared_data]
url = "https://github.com/t0b1kent/macrunner-wine.git"
revision = "ce9f9ed6177d57a43f6fd1e9c8d9be87224eb08a"

[toolchain]
url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260505/llvm-mingw-20260505-ucrt-macos-universal.tar.xz"
archive = "llvm-mingw-20260505-ucrt-macos-universal.tar.xz"
directory = "llvm-mingw-20260505-ucrt-macos-universal"
sha256 = "050379de888f0c843787819dadf183df3693330a5724643919e9121f16355295"

[reference]
url = "https://github.com/t0b1kent/macrunner-app/releases/download/v1.0.9/MacRunner-1.0.9-arm64.zip"
archive = "MacRunner-1.0.9-arm64.zip"
sha256 = "04f1ad4c6ee39538ce67b7137e47c20ae4a7eb72b261b86be5e9fd6f241e95b7"

[sources.wine]
url = "https://github.com/wine-mirror/wine.git"
revision = "7298a818b79446bae153b8d5aa27235ab3703bf9"

[sources.fex]
url = "https://github.com/FEX-Emu/FEX.git"
revision = "14c92681f4d62cf84d901460e0358de09c8847a7"
unix_patches = ["assets/patches/fex-upstream-darwin.patch"]

[wine]
configure = [
    "--disable-tests", "--without-x", "--without-alsa", "--without-capi",
    "--without-oss", "--without-pulse", "--with-coreaudio",
    "--without-gstreamer", "--without-gnutls", "--without-sdl", "--without-usb",
    "--without-vulkan", "--without-fontconfig", "--with-freetype",
    "--without-ffmpeg", "--without-cups", "--without-pcap",
]

[wine.runtime]
patches = [
    "assets/patches/wine-upstream-darwin.patch",
    "assets/patches/wine-upstream-integration.patch",
]
shared_data_helper = "dlls/ntdll/unix/macrunner_fex_kusd.h"
shared_data_helper_sha256 = "8e7d75d18572a01b37bfdbe6322e375f07d7920a460b76176f07cd4cdcca36a1"

[freetype]
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.gz"
archive = "freetype-2.14.3.tar.gz"
directory = "freetype-2.14.3"
sha256 = "e61b31ab26358b946e767ed7eb7f4bb2e507da1cfefeb7a8861ace7fd5c899a1"
